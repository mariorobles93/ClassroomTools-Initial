<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-Digit Code Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f4f4f4;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 300px;
        }

        .code {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 8px;
            margin: 20px 0;
        }

        .timer {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .expired {
            color: #c62828;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Verification Code</h2>

    <div id="code" class="code">------</div>

    <div id="timer" class="timer">
        15:00
    </div>

    <button onclick="generateCode()">Generate New Code</button>
</div>

<script>
    const VALIDITY_TIME = 15 * 60 * 1000; // 15 minutes

    let code = "";
    let expirationTime = null;
    let timerInterval = null;

    function generateCode() {
        // Generate a random 6-digit number
        code = Math.floor(100000 + Math.random() * 900000).toString();

        // Set expiration time
        expirationTime = Date.now() + VALIDITY_TIME;

        // Display code
        document.getElementById("code").textContent = code;

        // Reset timer
        clearInterval(timerInterval);
        updateTimer();

        timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        const timerElement = document.getElementById("timer");

        const remaining = expirationTime - Date.now();

        if (remaining <= 0) {
            clearInterval(timerInterval);

            timerElement.textContent = "EXPIRED";
            timerElement.classList.add("expired");

            document.getElementById("code").textContent = "------";

            return;
        }

        timerElement.classList.remove("expired");

        const totalSeconds = Math.floor(remaining / 1000);

        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        timerElement.textContent =
            `${minutes}:${seconds.toString().padStart(2, "0")}`;
    }

    // Generate the initial code when the page loads
    generateCode();
</script>

</body>
</html>
